user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 10240;
}

# 81/80/443 协议分流：TLS 请求 → 8443(https 后端)，明文 → 8081(http 后端)
# 游戏客户端 SDK 的 https 请求（证书为自签 SAN 证书，SDK 不校验）与普通 http 共存
stream {
    upstream http81  { server 127.0.0.1:8081; }
    upstream https81 { server 127.0.0.1:8443; }
    map $ssl_preread_protocol $backend {
        default http81;
        TLSv1.2 https81;
        TLSv1.3 https81;
        TLSv1.1 https81;
        TLSv1   https81;
        SSLv3   https81;
    }
    server { listen 81;  ssl_preread on; proxy_pass $backend; proxy_connect_timeout 5s; }
    server { listen 443; ssl_preread on; proxy_pass https81; proxy_connect_timeout 5s; }
    server { listen 80;  ssl_preread on; proxy_pass $backend; proxy_connect_timeout 5s; }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    include /etc/nginx/conf.d/*.conf;

    # 明文 HTTP 后端
    server {
        listen 8081;
        server_name _;
        root /www/wwwroot/game;
        index index.php index.html;
        charset utf-8;

        location / { try_files $uri $uri/ /index.html; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ /\. { deny all; }
    }

    # TLS 后端（游戏 SDK 登录用）
    server {
        listen 8443 ssl;
        server_name _;
        root /www/wwwroot/game;
        index index.php index.html;
        charset utf-8;
        ssl_certificate /etc/nginx/ssl/wd.crt;
        ssl_certificate_key /etc/nginx/ssl/wd.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

        location / { try_files $uri $uri/ /index.html; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ /\. { deny all; }
    }
}
