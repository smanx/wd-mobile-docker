name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # server/wd.zip 不入库（.gitignore）。构建时从 secret WD_ZIP_URL 下载。
      # 可以是任意可直链下载的对象存储 / release 附件。
      - name: Download server package (wd.zip)
        env:
          WD_ZIP_URL: ${{ secrets.WD_ZIP_URL }}
        run: |
          if [ -f server/wd.zip ]; then
            echo "wd.zip 已存在（本地构建）"
          elif [ -n "$WD_ZIP_URL" ]; then
            mkdir -p server
            curl -fL --retry 3 -o server/wd.zip "$WD_ZIP_URL"
            echo "sha256:"; sha256sum server/wd.zip
          else
            echo "::error::缺少 server/wd.zip，且未配置 secret WD_ZIP_URL"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
